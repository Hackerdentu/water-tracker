<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Giám Sát Độ Đục Nước</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px 16px;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    .device-pill {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
    }
    .dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .dot.offline { background: #ef4444; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .label {
      color: #94a3b8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .value {
      font-size: 2.6rem;
      font-weight: 700;
      margin: 8px 0 4px;
    }
    .unit {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 400;
    }
    .status-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .clean { background: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid #16a34a; }
    .dirty { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid #dc2626; }
    .waiting { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid #475569; }
    .chart-wrapper {
      position: relative;
      height: 320px;
      width: 100%;
    }
    .footer-note {
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Giám Sát Chất Lượng Nước (ESP32)</h1>
      <div class="device-pill">
        <span id="connDot" class="dot"></span>
        <span id="connText">Đang kiểm tra kết nối...</span>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="label">Độ Đục Hiện Tại</div>
        <div class="value"><span id="ntuVal">--</span> <span class="unit">NTU</span></div>
        <div id="statusBadge" class="status-badge waiting">Chờ dữ liệu...</div>
      </div>

      <div class="card">
        <div class="label">Điện Áp Cảm Biến</div>
        <div class="value"><span id="voltVal">--</span> <span class="unit">V</span></div>
        <div style="color:#94a3b8; font-size:0.85rem; margin-top:12px;">
          Cập nhật lúc: <strong id="lastUpdated" style="color:#e2e8f0;">--</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="label" style="margin-bottom: 12px;">Biểu Đồ Lịch Sử Độ Đục (50 mẫu gần nhất)</div>
      <div class="chart-wrapper">
        <canvas id="turbidityChart"></canvas>
      </div>
    </div>

    <div class="footer-note">Tự động làm mới dữ liệu mỗi 5 giây</div>
  </div>

  <script>
    const API_URL = '/api/turbidity';

    const ctx = document.getElementById('turbidityChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Độ đục (NTU)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.15)',
          borderWidth: 2,
          pointRadius: 3,
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          y: {
            beginAtZero: true,
            ticks: { color: '#94a3b8' },
            grid: { color: '#334155' }
          },
          x: {
            ticks: { color: '#94a3b8', maxTicksLimit: 8 },
            grid: { display: false }
          }
        },
        plugins: {
          legend: { labels: { color: '#f8fafc' } }
        }
      }
    });

    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const readings = await res.json();

        if (!Array.isArray(readings) || readings.length === 0) return;

        const latest = readings[readings.length - 1];
        const lastTime = new Date(latest.timestamp);
        const secondsAgo = (Date.now() - lastTime.getTime()) / 1000;

        // Cập nhật số liệu
        document.getElementById('ntuVal').innerText = Number(latest.ntu).toFixed(0);
        document.getElementById('voltVal').innerText = Number(latest.voltage).toFixed(2);
        document.getElementById('lastUpdated').innerText = lastTime.toLocaleTimeString('vi-VN');

        // Trạng thái nước sạch / đục
        const badge = document.getElementById('statusBadge');
        if (latest.isDirty) {
          badge.innerText = 'NƯỚC ĐỤC (ĐÈN ĐỎ)';
          badge.className = 'status-badge dirty';
        } else {
          badge.innerText = 'NƯỚC SẠCH (ĐÈN XANH)';
          badge.className = 'status-badge clean';
        }

        // Kiểm tra ESP32 còn online không (nếu quá 45s chưa gửi mới -> báo Offline)
        const dot = document.getElementById('connDot');
        const connText = document.getElementById('connText');
        if (secondsAgo <= 45) {
          dot.className = 'dot online';
          connText.innerText = 'ESP32 Online';
        } else {
          dot.className = 'dot offline';
          connText.innerText = `Mất tín hiệu (${Math.floor(secondsAgo)}s trước)`;
        }

        // Cập nhật biểu đồ
        chart.data.labels = readings.map(r => new Date(r.timestamp).toLocaleTimeString('vi-VN'));
        chart.data.datasets[0].data = readings.map(r => r.ntu);
        chart.update();
      } catch (err) {
        console.error('Fetch error:', err);
        document.getElementById('connDot').className = 'dot offline';
        document.getElementById('connText').innerText = 'Lỗi kết nối Server';
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
